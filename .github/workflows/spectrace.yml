# spectrace: every code commit pushed or proposed carries a Spec: trailer, even one
# made with --no-verify or in a clone without the hooks.
name: spectrace
on:
  push:
  pull_request:
jobs:
  trailers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: "Code commits carry a Spec: trailer"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh .githooks/check-trailers "$BASE" "$HEAD"
