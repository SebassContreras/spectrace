name: guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test "tests/*.test.mjs"
      - name: Contracts, specs, roadmap and commit messages
        run: node skills/spectrace/assets/guard/guard.mjs --all --commits "origin/${{ github.base_ref || 'main' }}..HEAD"
